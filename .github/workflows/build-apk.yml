name: Build Debug APK

on:
  push:
    branches: [claude/upi-transaction-tracker-ai1g27]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.2.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/UPITracker-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UPITracker-debug
          path: android/app/build/outputs/apk/debug/UPITracker-debug.apk
          retention-days: 30

      - name: Show download instructions
        run: |
          echo "===================================="
          echo "APK built successfully!"
          echo "Go to: Actions tab > this run > Artifacts section"
          echo "Download: UPITracker-debug"
          echo "===================================="
